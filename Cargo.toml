[package]
name = "smarkdown"
description = "A simple markdown tui editor, simple, fast, good!"
readme = "README.md"
repository = "https://github.com/pxdritz/smarkdown/"
license = "MIT"
keywords = ["markdown", "editor", "text", "vim", "nano"]
categories = ["command-line-utilities"]
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
